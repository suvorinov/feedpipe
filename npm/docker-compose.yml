name: npm

services:
  app:
    image: 'docker.io/jc21/nginx-proxy-manager:latest'
    container_name: nginx-proxy-manager
    restart: unless-stopped
    environment:
      - TZ=Europe/Moscow
    ports:
      - '80:80'
      - '81:81'
      - '443:443'
    volumes:
      - ./data:/data
      - ./letsencrypt:/etc/letsencrypt
    healthcheck:
      test: ["CMD", "/usr/bin/check-health"]
      interval: 10s
      timeout: 3s
    networks:
      - proxy

# Общая сеть для всех сервисов, спрятанных за NPM.
# `name: proxy` фиксирует имя глобально: любой другой compose-проект
# (feedpipe, будущие сервисы) подключается к ней через external: true.
networks:
  proxy:
    name: proxy
    driver: bridge
