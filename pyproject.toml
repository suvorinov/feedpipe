[tool.ruff]
# Проект пишет даты в БД как naive datetime (ISO-строки) — это осознанный выбор,
# поэтому DTZ-правила не включаем. Широкие except и Depends() в дефолтах — тоже
# осознанный стиль (сетевая логика, FastAPI-депенденсы).
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "S"]
ignore = [
    "B008",
    "BLE001",
    "S110",
    "RUF012",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]