<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Эффект неонового свечения -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- Фон: глубокий черный -->
  <rect width="100" height="100" fill="#0e0e0e" rx="15" />
  
  <!-- Стрелочка -->
  <path d="M30 25 L70 50 L30 75 M65 50 L30 50" 
        stroke="#00ff9d" 
        stroke-width="10" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        fill="none" 
        filter="url(#glow)" />
</svg>
