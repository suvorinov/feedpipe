{% for article in articles %}
<article class="article-card" id="article-{{ article.id }}">
    {% include "article_card_content.html" %}
    {% include "article_card_actions.html" %}
</article>
{% endfor %}

{% if next_offset < view_count %}
<div class="load-more-wrapper" id="load-more-wrapper">
    <button class="btn-load-more" id="load-more-btn"
            hx-get="/?view={{ view }}&offset={{ next_offset }}"
            hx-target="#load-more-wrapper"
            hx-swap="outerHTML"
            hx-indicator="#load-more-btn">
        {% if lang == 'en' %}Load more{% else %}Загрузить ещё{% endif %}
    </button>
</div>
{% endif %}
