<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FEEDPIPE // AUTH</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <style>
        * { box-sizing: border-box; }
        body { background: #0e0e0e; color: #e0e0e0; font-family: 'Courier New', monospace; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { border: 1px solid #333; padding: 2rem; width: 340px; }
        h2 { color: #00ff9d; font-size: 14px; border-bottom: 1px solid #333; padding-bottom: 10px; margin-top: 0; }
        input { width: 100%; background: #1a1a1a; border: 1px solid #333; color: #e0e0e0; padding: 8px; margin-bottom: 10px; font-family: 'Courier New'; font-size: 12px; }
        input:focus { outline: 1px solid #00ff9d; }
        button { width: 100%; background: transparent; border: 1px solid #00ff9d; color: #00ff9d; padding: 8px; font-family: 'Courier New'; cursor: pointer; text-transform: uppercase; margin-top: 10px; }
        button:hover { background: #00ff9d; color: #0e0e0e; }
        .error { color: #ff3333; font-size: 11px; margin-bottom: 10px; border: 1px solid #ff3333; padding: 5px; }
    </style>
</head>
<body>
    <div class="box">
        <h2>> FEEDPIPE SYSTEM INIT</h2>
        {% if error %}<div class="error">> {{ error }}</div>{% endif %}
        <form action="/api/auth" method="POST">
            <input type="text" name="username" placeholder="> assign id:" required autofocus>
            <input type="password" name="passphrase" placeholder="> assign key:" required>
            <button type="submit">[ AUTHENTICATE ]</button>
        </form>
        <p style="font-size: 10px; color: #666; margin-top: 15px; text-align: center;">
            No email. No tracking. Just your ID and Key.
        </p>
    </div>
</body>
</html>
