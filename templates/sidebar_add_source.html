<h3>// {% if lang == 'en' %}Add Source{% else %}Добавить источник{% endif %}</h3>
<form class="add-form" hx-post="/api/feeds" hx-target=".feed-list" hx-swap="innerHTML">
    <input type="text" name="url" placeholder="{% if lang == 'en' %}URL or RSS link...{% else %}URL сайта или RSS...{% endif %}" required>
    <button type="submit" class="btn-action btn-add" style="margin:0;">
        <span class="bracket">[+]</span>
        {% if lang == 'en' %}inject{% else %}добавить{% endif %}
    </button>
    <div id="feed-error" class="feed-error"></div>
</form>
<script>
document.body.addEventListener('htmx:responseError', function(evt) {
    const xhr = evt.detail.xhr;
    if (xhr.status === 400 || xhr.status === 409) {
        try {
            const data = JSON.parse(xhr.responseText);
            showFeedError(data.error || 'Неизвестная ошибка!');
        } catch(e) {
            showFeedError(xhr.responseText || 'Неизвестная ошибка!');
        }
        evt.preventDefault();
    }
});
</script>
