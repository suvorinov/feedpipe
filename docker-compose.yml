services:
  feedpipe:
    build: .
    container_name: feedpipe
    # Порт на хост НЕ публикуем: сервис виден только внутри Docker-сети,
    # наружу его отдаёт Nginx Proxy Manager.
    # В NPM: forward host = feedpipe, port = 8000 (через общую сеть proxy).
    networks:
      - proxy
    volumes:
      - ./data:/app/data
      - ./templates:/app/templates:ro
      - ./static:/app/static:ro
    restart: unless-stopped
    environment:
      - TZ=Europe/Moscow
      - FEEDPIPE_DATA_DIR=/app/data

# Общая сеть с Nginx Proxy Manager (внешняя — её создаёт сам NPM,
# см. npm/docker-compose.yml; при docker compose down не удаляется).
# Если NPM уже живёт в своей сети — замените имя в поле name: на её название.
networks:
  proxy:
    external: true
    name: proxy
