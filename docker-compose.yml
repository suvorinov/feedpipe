services:
  feedpipe:
    build: .
    container_name: feedpipe
    ports:
      - "8700:8000"
    volumes:
      - ./data:/app/data
      - ./templates:/app/templates:ro
      - ./static:/app/static:ro
    restart: unless-stopped
    environment:
      - TZ=Europe/Moscow
      - FEEDPIPE_DATA_DIR=/app/data